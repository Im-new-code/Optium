name: Build Optium
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify metadata and mixin resources
        run: python3 scripts/verify_resources.py
      - name: Build mod JAR
        run: ./gradlew --no-daemon --stacktrace build
      - name: Verify packaged distribution JAR
        run: python3 scripts/verify_jar.py
      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: optium-mod-jar
          path: build/distributions/Optium-*.jar
          if-no-files-found: error
          retention-days: 14
